<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartShopper Norrköping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3724/3724720.png">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .ios-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .ios-btn:active { transform: scale(0.92); opacity: 0.8; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        /* Döljer scrollbar men behåller funktion */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-40">

    <nav class="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-5 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-extrabold uppercase tracking-[0.2em] text-blue-600 mb-0.5">Norrköping Live</p>
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">SmartShopper</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="statusDot" class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <div class="h-8 w-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-width="2"></path></svg>
            </div>
        </div>
    </nav>

    <div class="px-6 py-6">
        <div class="relative group">
            <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2.5" stroke-linecap="round"></path></svg>
            </div>
            <input type="text" id="mainSearch" placeholder="Sök bland alla varor..." 
                   class="w-full bg-white border-0 shadow-sm ring-1 ring-slate-200 p-4 pl-12 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-base">
        </div>
    </div>

    <main class="px-6">
        <div id="sectionTitle" class="flex items-center justify-between mb-5">
            <h2 class="text-lg font-bold text-slate-800">Veckans klipp</h2>
            <button onclick="location.reload()" class="text-blue-600 text-sm font-semibold">Uppdatera</button>
        </div>

        <div id="productGrid" class="product-grid">
            <div class="col-span-2 text-center py-20 text-slate-400">
                Laddar priser från Norrköping...
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-6 glass border-t border-slate-200 safe-area-bottom">
        <div class="flex gap-3 items-center mb-4">
            <div id="cartPreview" class="flex -space-x-2 overflow-hidden">
                </div>
            <p id="cartSummary" class="text-xs font-semibold text-slate-500">Inga varor valda</p>
        </div>
        <button onclick="generateOptimizedPDF()" 
                class="ios-btn w-full bg-slate-900 text-white py-4 px-6 rounded-2xl shadow-xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2"></path></svg>
                <span class="font-bold tracking-tight">Optimera & Dela PDF</span>
            </div>
            <span id="totalPrice" class="bg-blue-600 px-3 py-1 rounded-lg text-sm font-bold">0 kr</span>
        </button>
    </div>

    <script>
        let database = [];
        let cart = [];

        // HÄMTA DATA: Denna läser från data.json som din robot skapar
        async function loadData() {
            try {
                const res = await fetch('data.json');
                database = await res.json();
                renderProducts(database.filter(i => i.promo).slice(0, 20)); // Visa kampanjer först
            } catch (e) {
                // Fallback om data.json saknas under första bygget
                database = [
                    { id: 101, name: "Gevalia Bryggkaffe", brand: "Gevalia", amount: "450g", img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=200", prices: { ica: 55, willys: 39, lidl: 45, citygross: 49 }, promo: true },
                    { id: 102, name: "Bregott Normalsaltat", brand: "Arla", amount: "500g", img: "https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=200", prices: { ica: 62, willys: 45, lidl: 52, citygross: 59 }, promo: true }
                ];
                renderProducts(database);
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            if(items.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center py-20 text-slate-400 italic">Hittade inga varor i Norrköping...</div>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const storePrices = Object.values(item.prices);
                const minPrice = Math.min(...storePrices);
                const isSelected = cart.some(c => c.id === item.id);

                return `
                    <div class="ios-btn bg-white p-4 rounded-[24px] border border-slate-100 shadow-sm relative overflow-hidden" onclick="toggleAddToCart(${item.id})">
                        ${item.promo ? '<div class="absolute top-0 right-0 bg-red-500 text-white text-[9px] font-black px-3 py-1 rounded-bl-xl uppercase">Klipp</div>' : ''}
                        <img src="${item.img}" class="w-full h-28 object-contain mb-3 mix-blend-multiply">
                        <h3 class="font-bold text-sm text-slate-800 leading-tight mb-1 h-8 overflow-hidden">${item.name}</h3>
                        <div class="flex items-center justify-between mt-2">
                            <p class="text-[14px] font-black text-blue-600">${minPrice.toFixed(2)} kr</p>
                            <div class="${isSelected ? 'bg-green-500' : 'bg-slate-900'} text-white p-1.5 rounded-xl transition-colors">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path d="${isSelected ? 'M5 13l4 4L19 7' : 'M12 4v16m8-8H4'}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                        <p class="text-[9px] text-slate-400 mt-2 uppercase font-bold tracking-tighter">${item.brand} • ${item.amount}</p>
                    </div>
                `;
            }).join('');
        }

        // Sökfunktion - söker i allt
        document.getElementById('mainSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.getElementById('sectionTitle').innerHTML = term.length > 0 ? `<h2 class="text-lg font-bold text-slate-800">Sökresultat för "${term}"</h2>` : `<h2 class="text-lg font-bold text-slate-800">Veckans klipp</h2>`;
            
            const filtered = database.filter(i => 
                i.name.toLowerCase().includes(term) || 
                i.brand.toLowerCase().includes(term)
            ).slice(0, 40);
            renderProducts(filtered);
        });

        function toggleAddToCart(id) {
            const index = cart.findIndex(c => c.id === id);
            if(index > -1) cart.splice(index, 1);
            else cart.push(database.find(i => i.id === id));
            
            updateCartUI();
            // Re-render för att visa check-mark
            const term = document.getElementById('mainSearch').value;
            const currentItems = term ? database.filter(i => i.name.toLowerCase().includes(term.toLowerCase())) : database.filter(i => i.promo);
            renderProducts(currentItems.slice(0, 40));
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + Math.min(...Object.values(item.prices)), 0);
            document.getElementById('totalPrice').innerText = total.toFixed(0) + ' kr';
            document.getElementById('cartSummary').innerText = cart.length === 0 ? 'Inga varor valda' : `${cart.length} varor redo att optimeras`;
            
            const preview = document.getElementById('cartPreview');
            preview.innerHTML = cart.slice(-4).map(i => `<img src="${i.img}" class="h-8 w-8 rounded-full border-2 border-white object-cover bg-white">`).join('');
        }

        function generateOptimizedPDF() {
            if(cart.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFont("helvetica", "bold");
            doc.text("DIN OPTIMERADE INKÖPSLISTA", 20, 25);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("Priser hämtade från Norrköping live", 20, 32);

            const stores = { ica: "ICA Maxi", willys: "Willys", lidl: "Lidl", citygross: "City Gross" };
            let y = 50;

            Object.keys(stores).forEach(storeKey => {
                const items = cart.filter(item => {
                    const cheapest = Object.keys(item.prices).reduce((a, b) => item.prices[a] < item.prices[b] ? a : b);
                    return cheapest === storeKey;
                });

                if(items.length > 0) {
                    doc.setFont(undefined, 'bold');
                    doc.text(stores[storeKey].toUpperCase(), 20, y);
                    y += 8;
                    doc.setFont(undefined, 'normal');
                    items.forEach(i => {
                        doc.text(`- ${i.name} (${i.brand}): ${i.prices[storeKey].toFixed(2)} kr`, 25, y);
                        y += 7;
                    });
                    y += 10;
                }
            });

            doc.save(`Inkop_Norrkoping_${new Date().toLocaleDateString()}.pdf`);
        }

        loadData();
    </script>
</body>
</html>
